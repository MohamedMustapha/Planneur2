name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Unit and architecture tests need no Docker and no browser, so they run first and fail fast. A broken module
  # boundary should be known in under a minute, not after a five-minute container pull.
  fast:
    name: Unit + architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore Cracra.slnx
      - run: dotnet build Cracra.slnx --no-restore -c Release

      - name: Unit
        run: dotnet test tests/Unit/Cracra.Tests.Unit.csproj --no-build -c Release

      - name: Architecture
        run: dotnet test tests/Architecture/Cracra.Tests.Architecture.csproj --no-build -c Release

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Testcontainers starts Postgres itself; the runner just needs a Docker daemon, which ubuntu-latest has.
      # `dotnet run` rather than `dotnet test`: the MSBuild wrapper prints the counts and swallows the names, so
      # a red build says "Failed: 1 of 475" and nothing about which one. The runner underneath prints each
      # failure and its assertion, which is the difference between a log you can act on and a rerun.
      - name: Integration
        run: dotnet run --project tests/Integration/Cracra.Tests.Integration.csproj -c Release

  web:
    name: Angular build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22 requires 24.15+. Pinning the minor avoids a green build on a version nobody develops on.
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

  e2e:
    name: E2E (full Aspire stack)
    runs-on: ubuntu-latest
    needs: [fast, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: dotnet build tests/E2E/Cracra.Tests.E2E.csproj -c Release

      # Cached separately from the NuGet restore: the browser is ~200 MB and changes only when Playwright does.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}

      - name: Install Chromium
        run: pwsh tests/E2E/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      # Same reason as the integration job: names and assertions rather than a count.
      - name: E2E
        run: dotnet run --project tests/E2E/Cracra.Tests.E2E.csproj --no-build -c Release
        env:
          # The AppHost demands every parameter; CI supplies throwaway values. These are not secrets — the stack
          # they protect is destroyed with the runner.
          Parameters__postgres-password: ci-postgres-password
          Parameters__app-owner-password: ci-owner-password
          Parameters__app-rw-password: ci-runtime-password
          Parameters__keycloak-admin-password: ci-keycloak-password
          Parameters__bff-client-secret: cracra-bff-dev-secret
          Parameters__storage-access-key: ci-access-key
          Parameters__storage-secret-key: ci-secret-key

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: tests/E2E/bin/Release/net10.0/playwright-*
          if-no-files-found: ignore
