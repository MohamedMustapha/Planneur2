<nav
  class="rail"
  [class.rail--collapsed]="!layout.railExpanded()"
  *transloco="let t"
  [attr.aria-label]="t('nav.ariaLabel')"
>
  <div class="rail__brand">
    <span class="rail__logo" aria-hidden="true">A</span>
    @if (layout.railExpanded()) {
      <span class="rail__brand-text">{{ t('shell.appName') }}</span>
    }
  </div>

  <ul class="rail__items">
    @for (item of items(); track item.id) {
      <li>
        <a
          class="rail__item"
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [title]="t(item.labelKey)"
          [attr.aria-label]="t(item.labelKey)"
        >
          <span class="rail__icon" aria-hidden="true">{{ item.icon }}</span>
          @if (layout.railExpanded()) {
            <span class="rail__label">{{ t(item.labelKey) }}</span>
          }
        </a>
      </li>
    }
  </ul>

  <button
    type="button"
    class="rail__toggle"
    (click)="layout.toggleRail()"
    [attr.aria-expanded]="layout.railExpanded()"
    [attr.aria-label]="layout.railExpanded() ? t('shell.collapseNav') : t('shell.expandNav')"
  >
    <span class="rail__icon" aria-hidden="true">{{ layout.railExpanded() ? '‹' : '›' }}</span>
    @if (layout.railExpanded()) {
      <span class="rail__label">{{ t('shell.collapseNav') }}</span>
    }
  </button>
</nav>
